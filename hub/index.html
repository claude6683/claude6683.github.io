<!DOCTYPE html>
<html>
<head>
<base target="_top">
<script src="shim.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading View</title>
<style>
  :root { --ink:#212633; --sub:#7f8793; --line:#e3e6ec; --bg:#f6f7fa; --navy:#1b1f2d; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--navy); color:#fff;
           display:flex; align-items:center; gap:8px; padding:10px 14px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; font-weight:700; white-space:nowrap; }
  #tabs { display:flex; gap:6px; }
  .tab { background:transparent; color:#cfd3dc; border:1px solid #3a4152; border-radius:999px;
         padding:7px 16px; font-size:14px; cursor:pointer; font-family:inherit; }
  .tab.on { background:#fff; color:var(--navy); border-color:#fff; font-weight:700; }
  #status { margin-left:auto; font-size:12px; color:#aab0bc; }
  #tick { position:fixed; top:3px; left:12px; right:12px; z-index:9999; pointer-events:none; background:transparent;
         font-size:12px; line-height:1.2; white-space:nowrap; text-align:right; overflow:hidden;
         font-weight:700; color:#FF4D4F; }
  #tick i { font-style:normal; display:inline-block; }
  #tick i.mq { animation:tickMq var(--mqd,10s) ease-in-out infinite alternate; }
  @keyframes tickMq { from { transform:translateX(0); } to { transform:translateX(var(--mqx,0px)); } }
  main { padding:12px; }
  .wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; background:#fff;
          border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:separate; border-spacing:0; font-size:13px; }
  td { border-bottom:1px solid var(--line); padding:6px 8px; white-space:pre-wrap;
       vertical-align:middle; background:#fff; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.first { position:sticky; left:0; z-index:1; box-shadow:1px 0 0 var(--line); }
  td.lone { position:static; box-shadow:none; }
  td.spark { padding:4px 6px; }
  td.spark svg { display:block; width:100%; }
  a { color:#2563eb; text-decoration:none; word-break:break-all; }
  td a.news { color:inherit; border-bottom:1px dotted #9aa1ad; word-break:normal; }
  #msg { padding:40px; text-align:center; color:var(--sub); }

  @media (max-width: 640px) {
    header { padding:8px 10px; gap:6px; }
    header h1 { font-size:15px; }
    .tab { padding:6px 13px; font-size:13px; }
    #status { width:100%; margin-left:0; font-size:11px; }
    #tick { top:2px; left:8px; right:8px; font-size:11px; }
    main { padding:6px; }
    .wrap { border-radius:8px; }
    table { font-size:12px; }
    td { padding:5px 6px; }
    td.mhide { display:none; }
  }
  .snd-box { display:inline-flex; align-items:center; gap:10px; margin-left:16px; vertical-align:middle;
             font-size:12px; font-weight:400; color:#7f8793; }
  .snd-btn { font-family:inherit; font-size:13px; font-weight:600; line-height:1.2; border:1px solid #cfd3dc; background:#fff; color:#4b5260;
             border-radius:999px; padding:5px 12px; cursor:pointer; white-space:nowrap; }
  .snd-btn.on { background:#1b1f2d; color:#fff; border-color:#1b1f2d; }
  .snd-last { font-variant-numeric:tabular-nums; white-space:nowrap; padding:2px 4px; border-radius:4px; }
  .snd-last.flash { animation:sndf .7s ease-out; }
  @keyframes sndf { from { background:#fff1a8; } to { background:transparent; } }
  @media (max-width: 640px) { .snd-box { margin-left:8px; gap:6px; } .snd-last { display:none; } .snd-btn { font-size:12px; padding:4px 10px; } }
  /* Kimp 탭: Fear 탭과 같은 글씨 크기(14px)·줄간격·폰트·여백·모서리 */
  .kimp-w { padding:12px; border-radius:12px; }
  .kimp-t { font-size:12.5px; line-height:1.45; width:100%; }
  .kimp-t td { padding:6px 8px; }
  .kimp-t col { min-width:0 !important; }
  @media (max-width: 640px) { .kimp-w { border-radius:12px; padding:12px; } .kimp-t { font-size:12.5px; } .kimp-t td { padding:6px 3px; } }
  .cal-td { background:#fff; padding:4px 8px 10px; white-space:normal; }
  .cal { max-width:900px; position:sticky; left:8px; }
  .cal-h { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:2px 0 8px; }
  .cal-h button { border:1px solid #cfd3dc; background:#fff; color:#4b5260; border-radius:6px; height:28px; min-width:30px;
                  font-family:inherit; font-size:12px; cursor:pointer; }
  .cal-h button:disabled { opacity:.35; cursor:default; }
  .cal-h .m { font-weight:700; font-size:15px; min-width:104px; text-align:center; }
  .cal-h .cal-today { padding:0 10px; }
  .cal-leg { display:flex; flex-wrap:wrap; gap:4px 12px; margin-left:auto; font-size:12px; color:#4b5260; }
  .cal-leg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .cal-g { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .cal-g > div { border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:72px; padding:4px 5px;
                 font-size:12px; background:#fff; overflow:hidden; }
  .cal-g > div.dow { min-height:0; text-align:center; font-weight:700; background:#f7f7f7; padding:5px 0; }
  .cal-g .sun .d, .cal-g .dow.sun { color:#dc2626; }
  .cal-g .sat .d, .cal-g .dow.sat { color:#2563eb; }
  .cal-g > div.out { background:#fafbfc; }
  .cal-g > div.out .d { opacity:.35; }
  .cal-g > div.today { background:#fffbea; }
  .cal-g > div.today .d { background:#1b1f2d; color:#fff; border-radius:999px; padding:0 6px; }
  .cal-g .ev { display:block; margin-top:3px; border-radius:4px; padding:2px 5px; color:#fff; font-weight:700; font-size:11px;
               line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-g .ev small { font-weight:500; opacity:.9; margin-left:4px; font-size:10px; }
  .cal-next { margin-top:8px; font-size:13px; color:#212633; }
  .cal-note { margin-top:4px; font-size:11px; color:#7f8793; }
  @media (max-width: 640px) {
    .cal { left:4px; }
    .cal-g > div { min-height:50px; padding:2px 3px; }
    .cal-g .ev { font-size:10px; padding:1px 3px; }
    .cal-g .ev small { display:none; }
    .cal-leg { margin-left:0; width:100%; font-size:11px; }
  }
  .cal-wrap { display:flex; gap:16px; align-items:flex-start; position:sticky; left:8px; max-width:min(1400px, calc(100vw - 48px)); }
  .cal-wrap .cal { position:static; flex:1 1 560px; max-width:700px; min-width:0; }
  .cal-side { flex:1 1 520px; min-width:0; max-width:680px; }
  .cs-top { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin:2px 0 8px; }
  .cs-sub { font-size:12px; color:#4b5260; line-height:18px; }
  .cs-h { font-weight:700; font-size:15px; line-height:28px; }
  .cs-empty { color:#7f8793; font-size:13px; padding:12px 0; }
  .cs-g { display:grid; grid-template-columns:minmax(88px, 0.8fr) 0.95fr 0.95fr 1.55fr;
          border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .cs-g > div { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px 7px;
                font-size:12px; line-height:1.45; background:#fff; min-width:0; overflow-wrap:anywhere; }
  .cs-g > div.dow { text-align:center; font-weight:700; background:#f7f7f7; padding:5px 0; color:#212633; }
  .cs-g > div.pend { background:#fafbfc; }
  .cs-g .cs-k { display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
  .cs-g .cs-k .ev { display:inline-block; margin:0; border-radius:4px; padding:2px 7px; color:#fff; font-weight:700; font-size:11px; line-height:1.35; }
  .cs-g .cs-d { color:#7f8793; font-size:11px; white-space:nowrap; }
  .cs-g .cs-a { font-weight:700; }
  .cs-g .cs-r { color:#212633; }
  .cs-g .cs-r1 { display:block; font-weight:600; }
  .cs-g .cs-r2 { display:block; margin-top:2px; color:#4b5260; }
  .cs-na { color:#aab0bc; }
  @media (max-width: 900px) {
    .cal-wrap { flex-direction:column; left:4px; }
    .cal-wrap .cal, .cal-side { max-width:none; width:100%; flex:none; }
  }
  .mon { position:relative; background:#0b0d10; border-radius:12px; padding:28px 16px 18px; min-height:calc(100vh - 110px); }
  .mon-g { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:14px; max-width:600px; margin:0 auto; }
  .mon-k { aspect-ratio:1 / 1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
           background:linear-gradient(160deg, #262a31 0%, #181b20 55%, #121418 100%);
           box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -4px 0 rgba(0,0,0,.45), 0 8px 18px rgba(0,0,0,.55);
           border:1px solid #2a2f37; }
  .mon-z { position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:8px; z-index:2; }
  .mon-z button { width:40px; height:40px; border-radius:10px; border:1px solid #2a2f37; color:#d7dbe2; font-size:22px; font-weight:700;
                  line-height:1; cursor:pointer; font-family:inherit; background:linear-gradient(160deg, #262a31 0%, #15181c 100%);
                  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -3px 0 rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.5); }
  .mon-z button:active { transform:translateY(1px); }
  .mon-t { font-size:calc(clamp(17px, 4.2vw, 28px) * var(--ms, 1)); font-weight:800; letter-spacing:.5px; }
  .mon-v { font-size:calc(clamp(13px, 3vw, 19px) * var(--ms, 1)); font-weight:600; color:#d7dbe2; text-shadow:none; font-variant-numeric:tabular-nums; }
  .mon-p { font-size:calc(clamp(14px, 3.4vw, 22px) * var(--ms, 1)); font-weight:700; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:4px; }
  .mon-s { font-size:1.15em; font-weight:800; min-width:.6em; text-align:center; }
  .mon-k.up { color:#3ee08f; text-shadow:0 0 10px rgba(62,224,143,.35); }
  .mon-k.dn { color:#ff5f5f; text-shadow:0 0 10px rgba(255,95,95,.35); }
  .mon-k.flat, .mon-k.na { color:#9aa1ad; }
  .mon-at { text-align:center; color:#6b7280; font-size:12px; margin-top:18px; }
  @media (max-width: 640px) { .mon { padding:16px 8px 12px; } .mon-g { gap:8px; } .mon-k { border-radius:10px; gap:4px; } }

  /* Kimp 탭: 김프(환율) 일평균 차트 + BUY/SELL 표 */
  .kh-td { padding:10px 0 14px; white-space:normal; background:#fff; }
  .kh-box { position:sticky; left:0; box-sizing:border-box; padding:0 8px; }
  .kh-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .kh-in { position:relative; }
  .kh-tip { position:absolute; display:none; pointer-events:none; background:rgba(27,31,45,.94); color:#fff; font-size:12px; line-height:1.55; padding:6px 9px; border-radius:6px; white-space:nowrap; z-index:3; }
  .kh-note { font-size:11px; color:#7f8793; margin:8px 2px 0; line-height:1.55; white-space:normal; }
  .kh-leg { font-size:12px; color:#4b5260; margin:0 2px 6px; white-space:normal; }
  table.kh-t { width:100%; max-width:560px; margin-top:12px; border:1px solid var(--line); border-radius:8px; border-collapse:separate; }
  table.kh-t th { background:#f6f7fa; font-weight:600; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); text-align:center; }
  table.kh-t td { text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }
  table.kh-t td.kb { color:#d1313b; }
  table.kh-t td.ks { color:#2f6bdb; }
  /* 상단 시세: 맨 위 띠에서 오른쪽→왼쪽으로 계속 흐름 (탭과 겹치지 않게 헤더를 20px 아래로) */
  body { padding-top:20px; }
  header { top:20px; }
  #tick { top:0; left:0; right:0; height:20px; line-height:20px; font-size:12px; text-align:left; background:var(--navy); }
  #tick i { padding-left:100%; animation:tickMarq var(--mqd,40s) linear infinite; }
  @keyframes tickMarq { from { transform:translateX(0); } to { transform:translateX(-100%); } }
</style>
</head>
<body>
<div id="tick" aria-hidden="true"><i id="tickIn"></i></div>
<header>
  <h1>📈 Trading View</h1>
  <div id="tabs"></div>
  <span id="status">불러오는 중…</span>
</header>
<main><div id="msg">불러오는 중…</div><div id="view"></div></main>

<script>
let DATA = null, CUR = 0, FIRST = true;   // 열자마자 Fear 탭 (처음 한 번만)
const REFRESH_SEC = 60;
const MOBILE = () => window.matchMedia('(max-width: 640px)').matches;

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function spark(vals, color, h) {
  if (!vals || vals.length < 2) return '';
  h = Math.max(24, Math.min(h || 26, MOBILE() ? 90 : 140) - 8);
  const w = 100, min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = vals.map((v, i) => (i * w / (vals.length - 1)).toFixed(2) + ',' +
                                  (h - 2 - (v - min) / span * (h - 4)).toFixed(2)).join(' ');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" height="' + h + '" preserveAspectRatio="none">' +
         '<polyline fill="none" stroke="' + esc(color) + '" stroke-width="2" vector-effect="non-scaling-stroke" ' +
         'stroke-linejoin="round" points="' + pts + '"/></svg>';
}

function renderTabs() {
  const tv = DATA ? DATA.tabs.map((t, i) => t.label === 'Kimp' ? '' :
    '<button class="tab' + (i === CUR ? ' on' : '') + '" onclick="show(' + i + ')">' + esc(t.label) + '</button>').join('') : '';
  document.getElementById('tabs').innerHTML =
    '<button class="tab' + (CUR === 'sim' ? ' on' : '') + '" onclick="showSim()">Sim</button>' +
    tv +
    '<button class="tab' + (CUR === 'mon' ? ' on' : '') + '" onclick="showMonitor()">Monitor</button>';
}

function showNews() {
  CUR = 'news';
  renderTabs();
  document.getElementById('view').innerHTML =
    '<iframe src="news.html" title="News" ' +
    'style="display:block;width:100%;height:calc(100vh - 110px);border:0;border-radius:10px;background:#f6f7fa"></iframe>';
  window.scrollTo(0, 0);
}



function showSim() {
  CUR = 'sim';
  renderTabs();
  document.getElementById('view').innerHTML =
    '<iframe src="sim.html" title="Simulation" ' +
    'style="display:block;width:100%;height:calc(100vh - 110px);border:0;border-radius:10px;background:#f6f7fa"></iframe>';
  window.scrollTo(0, 0);
}




function show(i) {
  CUR = i;
  renderTabs();
  renderSheet(DATA.tabs[i]);
  window.scrollTo(0, 0);
}

let KIMP_ON = false;   // Kimp 탭을 그리는 동안만 true (Fear 탭과 같은 글씨 크기·배율)
function cellStyle(cl) {
  let st = '';
  if (cl.b) st += 'background:' + cl.b + ';';
  if (cl.c) st += 'color:' + cl.c + ';';
  if (cl.w) st += 'font-weight:700;';
  if (cl.z) st += 'font-size:' + Math.round(cl.z * (KIMP_ON ? 1.0 : (MOBILE() ? 1.15 : 1.3))) + 'px;';
  if (cl.a) st += 'text-align:' + cl.a + ';';
  return st;
}

function renderSheet(s) {
  if (CUR === 'sim' || CUR === 'fish' || CUR === 'vix' || CUR === 'fag' || CUR === 'search' || CUR === 'mon' || CUR === 'news') return;
  const view = document.getElementById('view');
  if (!s.rows || !s.rows.length) { view.innerHTML = '<div id="msg">데이터 없음</div>'; return; }
  const mob = MOBILE();
  const mh = new Set(mob ? (s.mobileHide || []) : []);
  const shown = c => !s.cols[c].hidden && !mh.has(c);
  const visCols = s.cols.filter((c, i) => shown(i)).length;
  const firstCol = (s.sticky != null && shown(s.sticky)) ? s.sticky : s.cols.findIndex((c, i) => shown(i));
  const hiddenR = new Set(s.hiddenRows), skip = {}, span = {};
  s.merges.forEach(([r, c, rs, cs]) => {
    span[r + ',' + c] = [rs, cs];
    for (let i = r; i < r + rs; i++) for (let j = c; j < c + cs; j++) if (i !== r || j !== c) skip[i + ',' + j] = 1;
  });
  const kimp = s.label === 'Kimp';
  KIMP_ON = kimp;
  const scale = kimp ? (mob ? 0.55 : 1) : (mob ? 0.72 : 1);
  let html = '<div class="wrap' + (kimp ? ' kimp-w' : '') + '"><table' + (kimp ? ' class="kimp-t"' : '') + '><colgroup>' +
    s.cols.map((c, i) => shown(i) ? '<col style="min-width:' + Math.round(Math.max(36, c.w) * scale) + 'px">' : '').join('') +
    '</colgroup>';
  s.rows.forEach((row, r) => {
    if (hiddenR.has(r)) return;
    html += '<tr>';
    // 첫 칸에만 글자가 있는 행(제목·설명)은 표 전체 폭으로
    if (row[0].t && !span[r + ',0'] && row.every((cl, i) => i === 0 || (!cl.t && !cl.s))) {
      html += '<td class="lone" colspan="' + visCols + '" style="' + cellStyle(row[0]) + '">' + esc(row[0].t) + '</td></tr>';
      return;
    }
    row.forEach((cell, c) => {
      if (!shown(c) || skip[r + ',' + c]) return;
      let attrs = '';
      const sp = span[r + ',' + c];
      if (sp) {
        let cs = 0;
        for (let j = c; j < c + sp[1]; j++) if (shown(j)) cs++;
        if (sp[0] > 1) attrs += ' rowspan="' + sp[0] + '"';
        if (cs > 1) attrs += ' colspan="' + cs + '"';
      }
      const t = (cell.t || '').trim();
      const cls = [];
      if (c === firstCol && !(sp && sp[1] > 2)) cls.push('first');
      if (/^[+\-−]?[\d,]*\.?\d+%?$/.test(t) && !cell.a) cls.push('num');
      if (/^\+\d[\d,.]*%$/.test(t)) cls.push('up');
      if (/^[-−]\d[\d,.]*%$/.test(t) && !/^[-−]0(\.0+)?%$/.test(t)) cls.push('down');
      if (cell.s) cls.push('spark');
      let inner = cell.s ? spark(cell.s, cell.sc, cell.sh) : esc(cell.t || '');
      if (cell.l && /^https?:\/\//.test(cell.l)) {
        const isUrl = /^https?:\/\//.test(t);
        inner = '<a' + (isUrl ? '' : ' class="news"') + ' href="' + esc(cell.l) + '" target="_blank" rel="noopener">' + inner + '</a>';
      }
      let st = cellStyle(cell);
      if (cls.indexOf('up') >= 0) st += 'color:' + s.up + ';';
      if (cls.indexOf('down') >= 0) st += 'color:' + s.down + ';';
      html += '<td' + attrs + (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
              (st ? ' style="' + st + '"' : '') + '>' + inner + '</td>';
    });
    html += '</tr>';
  });
  view.innerHTML = html + '</table></div>';
  mountSound();
  mountCalendar();
  mountKimpChart(s);
  if (s.label === 'Trading View') { mountKimpBelow(); tidyTV(); }
}
// Trading View 탭 정리: 12종목 시세표·News 숨김(Calendar는 그대로), 1차매수 표를 YTD 표 옆으로
function tidyTV() {
  const table = document.querySelector('#view .wrap:not(.kimp-w) > table');
  if (!table || !table.tBodies[0]) return;
  const rows = [...table.tBodies[0].rows], tx = r => [...r.cells].map(c => c.textContent.trim());
  const hideBlock = i => { for (let k = i; k < rows.length; k++) { if (k > i && rows[k].textContent.trim() === '') break; rows[k].style.display = 'none'; } };
  let i = rows.findIndex(r => { const t = tx(r); return t[0] === '종목' && t[1] === '현재가격'; });
  if (i >= 0) hideBlock(i);
  i = rows.findIndex(r => tx(r)[0] === 'News');
  if (i >= 0) hideBlock(i);
  const y0 = rows.findIndex(r => { const t = tx(r); return t[0] === '종목' && t[1] === 'BTC'; });
  const b0 = rows.findIndex(r => { const t = tx(r); return t[0] === '종목' && t[1] !== 'BTC' && /^BTC/.test(t[1]); });
  if (y0 < 0 || b0 < 0 || b0 < y0) return;

  const host = document.createElement('tr'), span = Math.max(1, table.querySelectorAll('colgroup col').length);

  rows[y0].parentNode.insertBefore(host, rows[y0]);

  const fitPair = () => { box.style.zoom = 1; const avail = host.firstElementChild.clientWidth - 16, w = box.scrollWidth; box.style.zoom = Math.max(0.35, Math.min(0.8, avail / w)); };
  fitPair(); setTimeout(fitPair, 300);
  const web = rows.find(r => tx(r)[0] === '웹사이트 주소'); if (web) web.style.display = 'none';
  // Calendar 위의 빈 줄 숨김
  const ci = rows.findIndex(r => tx(r)[0] === 'Calendar');
  if (ci > 0) for (let k = 0; k < ci; k++) if (rows[k].textContent.trim() === '' && !rows[k].querySelector('.pairbox')) rows[k].style.display = 'none';
  // 맨 위 'Trading View' 제목 박스(제목·Sound·기준 안내·갱신 줄) 숨김
  const t0 = rows.findIndex(r => /^\s*Trading View/.test(tx(r)[0]));
  if (t0 >= 0) for (let k = t0; k < rows.length; k++) { const t = rows[k].textContent.trim(); if (k > t0 && t !== '' && !/^기준|BP 갱신|자동점검/.test(t)) break; rows[k].style.display = 'none'; }
}

// ===== 큰 체결 소리 (BTC 무기한선물 100만 달러 이상 체결 시 종소리) =====
// 바이낸스·바이비트·OKX 공개 체결 스트림을 직접 받아, 한 건이 기준 금액 이상이면 소리를 냄.
// 매수(시장가 매수)는 코인 획득 소리, 매도는 하강 아르페지오. 금액이 크면 여러 번 울림.
const SND = { on: false, min: 1000000, ctx: null, bus: null, verb: null, cur: 0, ends: [], ws: [], last: null, timers: [] };
try { SND.on = localStorage.getItem('tvSound') === 'on'; } catch (e) {}
const UP_NOTES = [659.26, 830.61, 987.77, 1318.51], DN_NOTES = [493.88, 369.99, 293.66, 246.94];

function sndAudio() {
  if (!SND.ctx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return false;
    const ctx = SND.ctx = new C();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    comp.connect(ctx.destination);
    SND.bus = ctx.createGain(); SND.bus.gain.value = 1.4; SND.bus.connect(comp);
    // 짧은 잔향(노이즈를 점점 줄여 만든 울림)
    const n = Math.floor(ctx.sampleRate * 1.0), ir = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.5); }
    const cv = ctx.createConvolver(); cv.buffer = ir;
    SND.verb = ctx.createGain(); SND.verb.gain.value = 0.18; SND.verb.connect(cv); cv.connect(comp);
  }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  return true;
}

// 종소리 한 음: 기본음 + 2배·3배 배음이 빠르게 줄어듦
function sndBell(freq, vol, len, delay) {
  const ctx = SND.ctx, now = ctx.currentTime;
  SND.ends = SND.ends.filter(t => t > now);
  const busy = SND.ends.length;
  if (busy > 200) return;
  if (SND.cur < now) SND.cur = now + 0.02;
  const t0 = delay == null ? SND.cur : SND.cur + delay;
  if (delay == null) SND.cur += busy <= 10 ? 0.08 : busy <= 20 ? 0.04 : 0.02;
  SND.ends.push(t0 + len);
  [[1, 1], [2, 0.35], [3, 0.12]].forEach(([mul, amp], k) => {
    if (busy > 20 && k) return; // 소리가 많이 겹치면 배음은 생략
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq * mul, t0);
    const d = len / (1 + k * 0.8), v = Math.max(0.0011, vol * amp);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(SND.bus); if (busy <= 20) g.connect(SND.verb);
    o.start(t0); o.stop(t0 + d + 0.03);
  });
}

// 한 음: 모양(type)·높이·시작 시각·길이·크기. 네모파는 저역 필터로 부드럽게
function sndNote(freq, type, t0, dur, vol, decay) {
  const ctx = SND.ctx, o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  lp.type = 'lowpass'; lp.frequency.value = type === 'square' ? 3000 : 8000;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0011, vol), t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(lp); lp.connect(g); g.connect(SND.bus);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
// 상승(매수) = 코인 획득 "띵-딩!", 하락(매도) = 하강 아르페지오 "미-도-라-파-레"
function sndUp(t0, vol) {
  sndNote(987.77, 'square', t0, 0.12, vol * 0.5, 0.2);
  sndNote(1318.51, 'square', t0 + 0.08, 0.5, vol * 0.5, 0.15);
  return 0.6;
}
function sndDown(t0, vol) {
  [659.26, 523.25, 440, 349.23, 293.66].forEach((f, i) => sndNote(f, 'triangle', t0 + i * 0.09, 0.5, vol, 0.2));
  return 0.9;
}
function sndPlay(buy, vol, times) {
  const ctx = SND.ctx, now = ctx.currentTime;
  if (SND.cur < now) SND.cur = now + 0.02;
  if (SND.cur - now > 6) return; // 너무 많이 밀리면 건너뜀
  for (let k = 0; k < times; k++) SND.cur += (buy ? sndUp : sndDown)(SND.cur, vol) * (k < times - 1 ? 0.75 : 0.35);
}

function sndTrade(usd, buy, price, ex) {
  SND.last = { usd, buy, price, ex, t: Date.now() };
  sndLabel();
  if (!SND.on || !SND.ctx) return;
  const m = SND.min;
  // 100만 달러 이상 1번, 1,000만 달러 이상 2번, 1억 달러 이상 3번 울림. 금액이 클수록 조금 더 크게
  const times = usd >= m * 100 ? 3 : usd >= m * 10 ? 2 : 1;
  const vol = Math.min(0.5, 0.22 + Math.log10(usd / m) * 0.1);
  sndPlay(buy, vol, times);
}

const CAL_MIN = [2026, 10], CAL_MAX = [2027, 11]; // 2026년 11월 ~ 2027년 12월 (월은 0부터)

function calPad(n) { return (n < 10 ? '0' : '') + n; }
function calKey(y, m, d) { return y + '-' + calPad(m + 1) + '-' + calPad(d); }
// 미국 서머타임: 3월 둘째 일요일 ~ 11월 첫째 일요일
function calUsDst(y, m, d) {
  const sun = (mm, nth) => { const f = new Date(Date.UTC(y, mm, 1)).getUTCDay(); return 1 + ((7 - f) % 7) + (nth - 1) * 7; };
  const t = Date.UTC(y, m, d), s = Date.UTC(y, 2, sun(2, 2)), e = Date.UTC(y, 10, sun(10, 1));
  return t >= s && t < e;
}
// 미국 동부시간 발표 시각 → 한국시간 문자열
function calKst(type, y, m, d) {
  const h = CAL_TYPES[type].et + (calUsDst(y, m, d) ? 13 : 14);
  const hh = Math.floor(h) % 24, mm = Math.round((h % 1) * 60);
  return (h >= 24 ? '익일 ' : '') + calPad(hh) + ':' + calPad(mm);
}
function calMap() {
  const map = {};
  Object.keys(CAL_EVENTS).forEach(t => CAL_EVENTS[t].forEach(k => { (map[k] = map[k] || []).push(t); }));
  return map;
}
function calToday() { // 한국 날짜
  const n = new Date(Date.now() + 9 * 3600 * 1000);
  return [n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()];
}
function calNext() {
  const t = calToday(), now = calKey(t[0], t[1], t[2]);
  let best = null;
  Object.keys(CAL_EVENTS).forEach(type => CAL_EVENTS[type].forEach(k => {
    if (k >= now && (!best || k < best.k)) best = { k, type };
  }));
  return best;
}

    if (CAL.y * 12 + CAL.m > CAL_MAX[0] * 12 + CAL_MAX[1]) { CAL.y = CAL_MAX[0]; CAL.m = CAL_MAX[1]; }
  }
  const y = CAL.y, m = CAL.m, map = calMap(), todayK = calKey(t[0], t[1], t[2]);
  const atMin = y * 12 + m <= CAL_MIN[0] * 12 + CAL_MIN[1], atMax = y * 12 + m >= CAL_MAX[0] * 12 + CAL_MAX[1];
  let h = '<div class="cal"><div class="cal-h">' +
    '<button type="button" onclick="calMove(-1)"' + (atMin ? ' disabled' : '') + '>◀</button>' +
    '<span class="m">' + y + '년 ' + (m + 1) + '월</span>' +
    '<button type="button" onclick="calMove(1)"' + (atMax ? ' disabled' : '') + '>▶</button>' +

    '<span class="cal-leg">' + Object.keys(CAL_TYPES).map(k => '<span><i style="background:' + CAL_TYPES[k].color + '"></i>' + CAL_TYPES[k].name + ' ' + CAL_TYPES[k].full + '</span>').join('') + '</span></div>';
  h += '<div class="cal-g">' + ['일', '월', '화', '수', '목', '금', '토'].map((d, i) => '<div class="dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + d + '</div>').join('');
  const first = new Date(Date.UTC(y, m, 1)).getUTCDay(), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const cells = Math.ceil((first + days) / 7) * 7;
  for (let i = 0; i < cells; i++) {
    const d = i - first + 1, dt = new Date(Date.UTC(y, m, d));
    const cy = dt.getUTCFullYear(), cm = dt.getUTCMonth(), cd = dt.getUTCDate(), k = calKey(cy, cm, cd), dow = i % 7;
    const cls = [dow === 0 ? 'sun' : dow === 6 ? 'sat' : '', cm !== m ? 'out' : '', k === todayK ? 'today' : ''].filter(Boolean).join(' ');
    h += '<div' + (cls ? ' class="' + cls + '"' : '') + '><span class="d">' + cd + '</span>';
    if (cm === m) (map[k] || []).forEach(type => {

    });

  let profit = 0, cost = 0, last = -1;
  for (let i = 0; i < n; i++) {
    if (ok(i)) last = i;
    if (d.s[i] === 1 && ok(i)) open.push(i);
    else if (d.s[i] === -1 && ok(i)) { open.forEach(k => { const p = INV * (u[i] / u[k] - 1); res.p[k] = p; profit += p; cost += INV; }); open.length = 0; }
  }
  if (last >= 0) open.forEach(k => { const p = INV * (u[last] / u[k] - 1); res.p[k] = p; profit += p; cost += INV; });
  res.ret = cost > 0 ? profit / cost * 100 : null;
  return res;
}
function khChartHtml(d, W) {
  const n = d.v.length, H = MOBILE() ? 300 : 360, IW = Math.max(W - 16, 760);
  const L = 10, R = 58, T = 36, B = 26;
  let mn = Infinity, mx = -Infinity;
  d.v.forEach(x => { if (x < mn) mn = x; if (x > mx) mx = x; });
  d.a.forEach(x => { if (x != null) { if (x < mn) mn = x; if (x > mx) mx = x; } });
  const padv = (mx - mn) * 0.16 || 1; mn -= padv; mx += padv;
  const X = i => L + (IW - L - R) * i / Math.max(1, n - 1);
  const Y = v => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  KH.g = { IW: IW, H: H, L: L, R: R, T: T, B: B, mn: mn, mx: mx, n: n };
  const raw = (mx - mn) / 5, pw = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  const stp = [1, 2, 2.5, 5, 10].map(m => m * pw).find(x => x >= raw) || raw;
  let g = '';
  let cntT = 0;
  for (let y = Math.ceil(mn / stp) * stp; y <= mx && cntT < 20; y += stp, cntT++) {
    const yy = Y(y);
    g += '<line x1="' + L + '" x2="' + (IW - R) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#e8ebf0"/>' +
      '<text x="' + (IW - R + 6) + '" y="' + (yy + 4).toFixed(1) + '" font-size="11" fill="#7f8793">' + y.toFixed(stp < 1 ? 1 : 0) + '%</text>';
  }
  if (mn < 0 && mx > 0) g += '<line x1="' + L + '" x2="' + (IW - R) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" stroke="#9aa1ad" stroke-dasharray="4 3"/>';
  let xl = '', pm = '';
  d.d.forEach((ds, i) => {
    const m = ds.slice(0, 7);
    if (m === pm) return;
    pm = m;
    if (i === 0 && Number(ds.slice(8, 10)) > 8) return;
    const mm = Number(ds.slice(5, 7));
    xl += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" font-size="11" fill="#7f8793" text-anchor="middle">' + (mm === 1 || i === 0 ? ds.slice(0, 4) + '.' + mm : mm + '월') + '</text>';
  });
  let pv = '', pa = '', started = false;
  d.v.forEach((x, i) => { pv += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1); });
  d.a.forEach((x, i) => { if (x == null) return; pa += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1); started = true; });
  const kt = khTrades(d);
  const wm = true ? '' : '<text x="' + (IW - R - 8) + '" y="' + (H - B - 8) + '" text-anchor="end" font-size="13" font-weight="700" fill="' + (kt.ret >= 0 ? '#d1313b' : '#2f6bdb') + '" fill-opacity=".55">1년 ' + (kt.ret >= 0 ? '+' : '') + kt.ret.toFixed(1) + '%</text>';
  let mk = '', lastB = -999, lastS = -999;
  [].forEach((sg, i) => {
    if (!sg) return;
    const x = X(i), y = Y(d.v[i]), buy = sg === 1, col = buy ? '#d1313b' : '#2f6bdb';
    mk += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.6" fill="' + col + '" stroke="#fff" stroke-width="1.2"/>';
    if (x - (buy ? lastB : lastS) < 40) return;
    if (buy) lastB = x; else lastS = x;
    const w = buy ? 34 : 38, cx = Math.min(Math.max(x, w / 2 + 2), IW - R - w / 2);
    const ly = buy ? Math.min(H - B - 32, y + 10) : Math.max(4, y - 28);
    mk += '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (buy ? y + 3.6 : y - 3.6).toFixed(1) + '" y2="' + (buy ? ly : ly + 18).toFixed(1) + '" stroke="' + col + '" stroke-opacity=".45"/>' +
      '<rect x="' + (cx - w / 2).toFixed(1) + '" y="' + ly.toFixed(1) + '" width="' + w + '" height="18" rx="9" fill="' + (buy ? '#fde2e4' : '#dde7fb') + '"/>' +
      '<text x="' + cx.toFixed(1) + '" y="' + (ly + 12.5).toFixed(1) + '" font-size="10.5" font-weight="700" fill="' + col + '" text-anchor="middle">' + (buy ? 'BUY' : 'SELL') + '</text>' +
      (buy && kt.p[i] != null ? '<text x="' + cx.toFixed(1) + '" y="' + (ly + 30).toFixed(1) + '" font-size="10" font-weight="700" fill="' + (kt.p[i] >= 0 ? '#d1313b' : '#2f6bdb') + '" text-anchor="middle">' + khFmt(kt.p[i]) + '</text>' : '');
  });
  const lv = d.v[n - 1], la = d.a[n - 1];
  let yv = Y(lv), ya = la == null ? null : Y(la);
  if (ya != null && Math.abs(ya - yv) < 19) ya = yv + (ya >= yv ? 19 : -19);
  const tag = (yy, txt, col) => '<rect x="' + (IW - R + 2) + '" y="' + (yy - 9).toFixed(1) + '" width="54" height="18" rx="3" fill="' + col + '"/>' +
    '<text x="' + (IW - R + 29) + '" y="' + (yy + 4).toFixed(1) + '" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">' + txt + '</text>';
  const tags = tag(yv, lv.toFixed(2) + '%', '#1f2937') + (ya == null ? '' : tag(ya, la.toFixed(2) + '%', '#f5a623'));
  return '<div class="kh-leg"><span style="color:#4b5563">━</span> 테더 김프 일평균 &nbsp;<span style="color:#f5a623">━</span> 직전 ' + d.avgDays + '일 평균 &nbsp;' +
    '</div>' +
    '<div class="kh-scroll" id="khSc"><div class="kh-in" style="width:' + IW + 'px;height:' + H + 'px">' +
    '<svg id="khSvg" width="' + IW + '" height="' + H + '" viewBox="0 0 ' + IW + ' ' + H + '" style="display:block">' + g + xl +
    '<path d="' + pa + '" fill="none" stroke="#f5a623" stroke-width="1.6"/>' +
    '<path d="' + pv + '" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linejoin="round"/>' + mk + tags + wm +
    '<line id="khCur" y1="' + T + '" y2="' + (H - B) + '" stroke="#9aa1ad" stroke-dasharray="3 3" style="display:none"/>' +
    '<line id="khCurH" x1="' + L + '" x2="' + (IW - R) + '" stroke="#9aa1ad" stroke-dasharray="3 3" style="display:none"/>' +
    '<rect id="khLblR" x="' + (IW - R + 2) + '" width="54" height="18" rx="3" fill="#2a2e39" style="display:none"/>' +
    '<text id="khLblT" x="' + (IW - R + 29) + '" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" style="display:none"></text>' +
    '<circle id="khDot" r="4" fill="#1f2937" stroke="#fff" stroke-width="1.5" style="display:none"/>' +
    '</svg><div class="kh-tip" id="khTip"></div></div></div>';
}
function khTableHtml(d) {
  let h = '<table class="kh-t"><tr><th>구분</th>' + d.counts.map(c => '<th>' + esc(c[0]) + '</th>').join('') + '</tr>';
  h += '<tr><td class="kb">BUY</td>' + d.counts.map(c => '<td class="kb">' + c[1].buy + '회</td>').join('') + '</tr>';
  h += '<tr><td class="ks">SELL</td>' + d.counts.map(c => '<td class="ks">' + c[1].sell + '회</td>').join('') + '</tr>';
  return h + '</table>';
}
function khBind(d) {
  const sc = document.getElementById('khSc'), svg = document.getElementById('khSvg');
  const tip = document.getElementById('khTip'), cur = document.getElementById('khCur'), dot = document.getElementById('khDot');
  const ch = document.getElementById('khCurH'), lr = document.getElementById('khLblR'), lt = document.getElementById('khLblT');
  const G = KH.g;
  if (!sc || !svg || !G) return;
  sc.scrollLeft = KH.sl != null ? KH.sl : sc.scrollWidth;
  sc.addEventListener('scroll', () => { KH.sl = sc.scrollLeft; });
  const hide = () => { tip.style.display = 'none'; cur.style.display = 'none'; dot.style.display = 'none'; ch.style.display = 'none'; lr.style.display = 'none'; lt.style.display = 'none'; };
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (G.IW / r.width);
    let i = Math.round((x - G.L) / ((G.IW - G.L - G.R) / Math.max(1, G.n - 1)));
    i = Math.max(0, Math.min(G.n - 1, i));
    const px = G.L + (G.IW - G.L - G.R) * i / Math.max(1, G.n - 1);
    const py = G.T + (G.H - G.T - G.B) * (1 - (d.v[i] - G.mn) / (G.mx - G.mn));
    cur.setAttribute('x1', px); cur.setAttribute('x2', px); cur.style.display = '';
    dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.style.display = '';
    // 십자선(+): 마우스 높이의 가로 점선 + 오른쪽 눈금에 그 높이의 김프(%)
    const my = (ev.clientY - r.top) * (G.H / r.height);
    if (my >= G.T && my <= G.H - G.B) {
      const val = G.mx - (my - G.T) / (G.H - G.T - G.B) * (G.mx - G.mn);
      ch.setAttribute('y1', my); ch.setAttribute('y2', my); ch.style.display = '';
      lr.setAttribute('y', my - 9); lr.style.display = '';
      lt.setAttribute('y', my + 4); lt.textContent = val.toFixed(2) + '%'; lt.style.display = '';
    } else { ch.style.display = 'none'; lr.style.display = 'none'; lt.style.display = 'none'; }
    const df = i > 0 ? d.v[i] - d.v[i - 1] : null;
    tip.innerHTML = '<b>' + esc(d.d[i]) + '</b><br>일평균 ' + d.v[i].toFixed(2) + '%' +
      (df == null ? '' : ' (전일 ' + (df >= 0 ? '+' : '') + df.toFixed(2) + '%p)') +
      '<br>직전 ' + d.avgDays + '일 평균 ' + (d.a[i] == null ? '-' : d.a[i].toFixed(2) + '%') +
      '';
    tip.style.display = 'block';
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(G.IW - tw - 4, px + 12 + tw > G.IW ? px - tw - 12 : px + 12)) + 'px';
    tip.style.top = '4px';
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', hide);
}

let lastMobile = null;
window.addEventListener('resize', () => {
  if (DATA && MOBILE() !== lastMobile) { lastMobile = MOBILE(); renderSheet(DATA.tabs[CUR]); }
});

function load() {
  google.script.run
    .withSuccessHandler(d => {
      DATA = d;
      lastMobile = MOBILE();
      document.getElementById('msg').style.display = 'none';
      document.getElementById('status').textContent = '불러온 시각 ' + d.at + ' · ' + REFRESH_SEC + '초마다 새로고침';
      if (FIRST) { FIRST = false; CUR = 0; }
      renderTabs();
      renderSheet(DATA.tabs[CUR]);
    })
    .withFailureHandler(e => {
      document.getElementById('status').textContent = '불러오기 실패: ' + (e && e.message ? e.message : e);
    })
    .web_getData();
}

setInterval(load, REFRESH_SEC * 1000);

// ===== 우측 상단 투명 시세 워터마크: Monitor 탭 9종목(값 + 등락률, 티커 없이) — web_monitorData 자료, 5분마다 갱신 =====
const TICK_SEC = 300;
function tickFit() {
  try {
    const el = document.getElementById('tickIn');
    el.style.setProperty('--mqd', Math.max(20, el.offsetWidth / 50).toFixed(1) + 's');   // 초당 약 50px
  } catch (e) {}
}
function tickLoad() {
  try {
    google.script.run.withSuccessHandler(d => {
      try {
        const ORDER = ['BTC', 'NASDAQ', 'S&P', 'USDKRW', 'KIMP', 'GOLD', 'US10Y', 'WTI', 'KOSPI'];   // 표시 순서
        const key = t => (t === 'KOSPI 야간' ? 'KOSPI' : t);
        const items = ((d && d.items) || []).slice().sort((p, q) => { const i = ORDER.indexOf(key(p.t)), j = ORDER.indexOf(key(q.t)); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
        const parts = items.map(x => {
          const c = x.c, has = typeof c === 'number' && isFinite(c);
          const a = has ? Math.abs(c * 100).toFixed(1) : '';
          const pct = !has ? '—' : (a === '0.0' ? '' : (c > 0 ? '+' : '-')) + a + '%';
          const col = !has || a === '0.0' ? '#9aa3b2' : (c > 0 ? '#FF4D4F' : '#3B82F6');
          return '<span style="color:' + col + '">' + (monPrice(x.t, x.p) + ' ' + pct + ' ' + key(x.t).slice(0,3).toUpperCase()).replace(/&/g, '&amp;') + '</span>';
        });
        if (!parts.length) return;
        document.getElementById('tickIn').innerHTML = parts.join(' <span style="color:#6b7280">/</span> ');
        tickFit();
      } catch (e) {}
    }).withFailureHandler(() => {}).web_monitorData();
  } catch (e) {}
}
tickLoad();
setInterval(tickLoad, TICK_SEC * 1000);
window.addEventListener('resize', tickFit);
