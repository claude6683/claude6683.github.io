<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>#6683</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--sub:#8b93a7;--ac:#4aa3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}
  main{max-width:720px;margin:0 auto;padding:32px 16px 48px}
  h1{font-size:22px;margin:0 0 24px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 24px}
  .list{display:grid;gap:12px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none;transition:border-color .15s}
  a.card:hover{border-color:var(--ac)}
  .t{font-size:17px;font-weight:600;margin:0 0 4px}
  .d{font-size:13px;color:var(--sub);margin:0}
  .tag{display:inline-block;font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:999px;padding:1px 8px;margin-top:8px}
  footer{margin-top:32px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<main>
  <h1>#6683</h1>
  <div class="list">
    <a class="card" href="https://claude6683.github.io/fractal-chart/">
      <p class="t">fractal-chart</p>
      <p class="d">현재 지수와 비슷한 과거 구간 3개를 겹쳐 보기 (나스닥·S&amp;P500·코스피·비트코인)</p>
      <span class="tag">평일 07:30 자동 갱신</span>
    </a>
  </div>
  <footer>본 사이트는 학습·참고용이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다.</footer>
</main>
</body>
</html>
