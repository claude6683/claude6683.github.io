name: deploy-live-worker

# worker/live-quotes.js 를 Cloudflare Worker 로 배포 (Live Show 시세 중계)
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (없으면 건너뜀)
on:
  push:
    paths:
      - "worker/live-quotes.js"
      - ".github/workflows/deploy-live-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Secrets 확인
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN 없음 - 배포 건너뜀"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: cloudflare/wrangler-action@v3
        if: env.SKIP != '1'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker/live-quotes.js --name live-quotes --compatibility-date 2024-11-01
