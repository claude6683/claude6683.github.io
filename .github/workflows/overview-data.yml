name: overview-data

on:
  schedule:
    - cron: "*/5 * * * 1-5"   # 평일 5분마다
    - cron: "0 * * * 0,6"     # 주말 매시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overview-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/overview_data.py
      - name: publish data branch
        run: |
          mkdir out && mv data.json out/
          cd out
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git commit -qm "data"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
