name: fishing-data

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fishing-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 이전 데이터 받기 (실패한 날짜 값 유지용)
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/fishing-data/fishing.json" -o old_fishing.json || true
      - run: python scripts/fishing_data.py
      - name: publish fishing-data branch
        run: |
          mkdir out && mv fishing.json out/
          cd out
          git init -q -b fishing-data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fishing.json
          git commit -qm "fishing data"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fishing-data
