name: smc-data

on:
  schedule:
    - cron: "*/15 * * * 1-5"   # 평일 15분마다
    - cron: "0 */6 * * 0,6"    # 주말 6시간마다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smc-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/smc_data.py
      - name: publish smc-data branch
        run: |
          mkdir out && mv smc.json out/
          cd out
          git init -q -b smc-data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add smc.json
          git commit -qm "smc data"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smc-data
