name: xyz-data

on:
  schedule:
    - cron: '*/30 0-7,13-21 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xyz-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: VIX
        continue-on-error: true
        run: |
          mkdir -p xyz-data
          curl -sSf -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?range=5y&interval=1d" -o xyz-data/vix.json
      - name: IXIC
        continue-on-error: true
        run: python scripts/xyz_update_ixic.py
      - name: KOSPI
        continue-on-error: true
        run: python scripts/xyz_update_kospi.py
      - name: KOSPI 60m
        continue-on-error: true
        run: python scripts/xyz_update_kospi60.py
      - name: VKOSPI
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/xyz_fetch_vkospi.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xyz-data
          git diff --cached --quiet && exit 0
          git commit -m "update xyz data"
          git pull --rebase origin main
          git push
